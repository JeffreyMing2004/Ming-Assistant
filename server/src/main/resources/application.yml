spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ming_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MING_DB_USERNAME:root}
    password: ${MING_DB_PASSWORD:Aa123123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${MING_SERVER_PORT:8080}

app:
  jwt:
    secret: ${MING_JWT_SECRET:ming-assistant-dev-jwt-secret-please-change-in-production-0123456789}
    expiration-hours: 168
  bilibili:
    uid: 342163344
  qq:
    # QQ音乐歌单后台自动同步：定期抓取歌单并与数据库对比，缺失的歌曲自动加入歌单
    sync-enabled: ${MING_QQ_SYNC_ENABLED:true}
    playlist: ${MING_QQ_PLAYLIST:9770556958}
    owner-username: ${MING_QQ_OWNER:testuser}
    sync-interval-ms: ${MING_QQ_SYNC_INTERVAL_MS:1800000}